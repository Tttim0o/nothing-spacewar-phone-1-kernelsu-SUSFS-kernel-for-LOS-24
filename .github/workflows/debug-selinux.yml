name: Debug - dump patched selinux.c

on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-22.04
    steps:
      - name: Stiahni kernel zdrojaky (plytke, len pre strukturu)
        run: |
          git clone --depth=1 -b lineage-24.0 https://github.com/LineageOS/android_kernel_nothing_sm7325 kernel

      - name: Integruj KernelSU-Next (pinnuty commit)
        working-directory: kernel
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/legacy/kernel/setup.sh" | bash -s 7ac03d638c07bac1cb1ae9749fdf7e0db60b4a7a

      - name: Aplikuj SUSFS patch na KernelSU-Next
        working-directory: kernel
        run: |
          git clone --depth=1 -b kernel-5.4 https://gitlab.com/simonpunk/susfs4ksu.git ../susfs4ksu
          cd KernelSU-Next
          patch -p1 --batch --fuzz=3 -N < ../../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch
          cd ..

      - name: Dump vysledny selinux.c cely + grep na problem miesta
        working-directory: kernel
        run: |
          echo "=== cely subor ==="
          cat -n KernelSU-Next/kernel/selinux/selinux.c
          echo ""
          echo "=== reject subor ak existuje ==="
          cat KernelSU-Next/kernel/selinux/selinux.c.rej 2>&1 || echo "ziadny reject subor"
