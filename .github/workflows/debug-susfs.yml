name: Debug - dump susfs4ksu patches

on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-22.04
    steps:
      - name: Clone susfs4ksu kernel-5.4
        run: |
          git clone --depth=1 -b kernel-5.4 https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu
          echo "=== tree ==="
          find susfs4ksu/kernel_patches -maxdepth 3 | sort

      - name: Upload patches as artifact
        uses: actions/upload-artifact@v4
        with:
          name: susfs-patches-dump
          path: susfs4ksu/kernel_patches
