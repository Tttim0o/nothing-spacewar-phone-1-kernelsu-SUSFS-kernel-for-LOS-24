name: Build Spacewar KSU+SUSFS Kernel

on:
  workflow_dispatch:
    inputs:
      los_branch:
        description: "LineageOS kernel branch"
        required: true
        default: "lineage-24.0"
      stock_boot_url:
        description: "URL na stock boot.img z tvojho LOS 24 buildu (nepovinne - ak das, dostanes hotovy boot.img)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      DEFCONFIG: "vendor/lahaina-qgki_defconfig vendor/lahaina_QGKI.config"
      CONFIG_FRAGMENT: "arch/arm64/configs/vendor/lahaina_QGKI.config"
      KERNEL_SRC: "https://github.com/LineageOS/android_kernel_nothing_sm7325"
      SUSFS_BRANCH: "kernel-5.4"
      ANYKERNEL: "https://github.com/osm0sis/AnyKernel3"

    steps:
      - name: Priprava prostredia
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex \
            git libssl-dev libncurses5-dev libelf-dev zip python3 \
            device-tree-compiler unzip wget

      - name: Stiahni kernel zdrojaky
        run: |
          git clone --depth=1 -b "${{ github.event.inputs.los_branch }}" \
            "$KERNEL_SRC" kernel

      - name: Clang toolchain (Proton)
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang "$GITHUB_WORKSPACE/clang"
          "$GITHUB_WORKSPACE/clang/bin/clang" --version | head -1

      - name: Integruj KernelSU-Next
        working-directory: kernel
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -

      - name: Aplikuj SUSFS patche
        working-directory: kernel
        run: |
          git clone --depth=1 -b "$SUSFS_BRANCH" \
            https://gitlab.com/simonpunk/susfs4ksu.git ../susfs4ksu

          echo "=== 1. Nove SUSFS zdrojove subory (fs/ include/) ==="
          cp ../susfs4ksu/kernel_patches/fs/* fs/ 2>/dev/null || true
          cp ../susfs4ksu/kernel_patches/include/linux/* include/linux/ 2>/dev/null || true

          echo "=== 2. SUSFS hooky do KernelSU-Next (realny patch, nie cp) ==="
          echo "Pozn.: tento patch je pisany pre konkretny starsi commit KernelSU-Next,"
          echo "takze niektore subory (napr. throne_tracker.*) nemusia existovat v 'next' HEAD."
          echo "To je bezne a nie je to fatalne - kluciove je, ci sa zapise Kconfig a core_hook.c."
          cd KernelSU-Next
          set +e
          patch -p1 --batch --fuzz=3 -N < ../../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch 2>&1 | tee /tmp/ksu_susfs_patch.log
          set -e
          cd ..
          echo "=== Zhrnutie: ktore subory sa upravili ==="
          grep -E "^patching file|Skipping patch" /tmp/ksu_susfs_patch.log || true
          echo "=== Kriticka kontrola: zapisal sa Kconfig? ==="
          grep -q "KSU_SUSFS" KernelSU-Next/kernel/Kconfig && echo "OK: Kconfig ma KSU_SUSFS" || \
            { echo "CHYBA: Kconfig patch na KernelSU-Next zlyhal, SUSFS sa nezapne"; exit 1; }

          echo "=== 3. Hlavny SUSFS patch do kernel stromu (non-interaktivne, preskoci chybajuce subory) ==="
          patch -p1 --batch --fuzz=3 -N < ../susfs4ksu/kernel_patches/50_add_susfs_in_kernel-5.4.patch || \
            echo "VAROVANIE: niektore hunky nesadli, dolepujem rucne nizsie"

          echo "=== 4. Rucna oprava pre hunky, ktore na tomto LOS strome nesadli kvoli inemu kontextu ==="
          if ! grep -q "CONFIG_KSU_SUSFS" include/linux/mount.h; then
            python3 "$GITHUB_WORKSPACE/scripts/fix_mount_h.py"
          fi
          if ! grep -q "susfs_def.h" fs/proc/task_mmu.c; then
            python3 "$GITHUB_WORKSPACE/scripts/fix_task_mmu.py"
          fi

          echo "=== 5. bootconfig.c spoof - preskakujem, subor v tomto strome neexistuje (volitelne, neblokujuce) ==="
          rm -f fs/proc/bootconfig.c.orig fs/proc/task_mmu.c.rej include/linux/mount.h.rej 2>/dev/null || true

          echo "=== 6. Maphide / anti-detekcia (hide_stuff) - zdrojova URL momentalne nedostupna (404), preskakujem ==="
          echo "TODO: najst aktualny zdroj 69_hide_stuff.patch a doplnit v buducom builde"

      - name: Zapni KSU/SUSFS vo fragmente
        working-directory: kernel
        run: |
          cat >> "$CONFIG_FRAGMENT" <<'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=n
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_TMPFS_XATTR=y
          EOF

      - name: Build kernelu
        working-directory: kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export ARCH=arm64 SUBARCH=arm64
          export KBUILD_BUILD_USER=claude KBUILD_BUILD_HOST=github-actions
          MAKE_ARGS="O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu-"
          make $MAKE_ARGS $DEFCONFIG
          echo "=== kontrola, ci sa KSU a SUSFS naozaj zapli ==="
          grep -q "CONFIG_KSU=y" out/.config || { echo "CHYBA: KSU nie je v .config - KSU integracia zlyhala"; exit 1; }
          grep -q "CONFIG_KSU_SUSFS=y" out/.config || { echo "CHYBA: SUSFS nie je v .config - SUSFS patch sa neaplikoval"; exit 1; }
          echo "OK: KSU aj SUSFS su zapnute"
          make -j$(nproc) $MAKE_ARGS KCFLAGS="-Wno-error"

      - name: Zabal AnyKernel3 zip
        run: |
          git clone --depth=1 "$ANYKERNEL" ak3
          cp kernel/out/arch/arm64/boot/Image* ak3/ 2>/dev/null || \
            cp kernel/out/arch/arm64/boot/Image ak3/
          cp kernel/out/arch/arm64/boot/dtb* ak3/ 2>/dev/null || true
          cd ak3 && zip -r9 ../Spacewar-KSU-SUSFS.zip . -x ".git*"

      - name: (volitelne) Vyrob hotovy boot.img
        if: ${{ github.event.inputs.stock_boot_url != '' }}
        run: |
          wget -q "https://github.com/topjohnwu/Magisk/releases/latest/download/Magisk-v28.1.apk" -O magisk.apk || \
            wget -q "https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk" -O magisk.apk
          unzip -o magisk.apk "lib/x86_64/*" -d magisk
          cp magisk/lib/x86_64/libmagiskboot.so ./magiskboot
          chmod +x magiskboot
          curl -LSs "${{ github.event.inputs.stock_boot_url }}" -o stock-boot.img
          ./magiskboot unpack stock-boot.img
          cp kernel/out/arch/arm64/boot/Image kernel
          ./magiskboot repack stock-boot.img new-boot.img

      - name: Nahraj artefakty
        uses: actions/upload-artifact@v4
        with:
          name: Spacewar-KSU-SUSFS
          path: |
            Spacewar-KSU-SUSFS.zip
            new-boot.img

      - name: Vytvor prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}-$(date +%Y%m%d)"
          cat > notes.md <<'EOF'
          ## NETESTOVANY, EXPERIMENTALNY BUILD

          Kernel pre **Nothing Phone (1) (Spacewar, sm7325)** na **LineageOS 24 (Android 17)** s **KernelSU-Next + SUSFS**.

          - Build bol vygenerovany automaticky pomocou AI (Claude) a **NEBOL otestovany na realnom zariadeni**.
          - **NEFLASHUJ naslepo.** Najprv `fastboot boot new-boot.img` (docasne), az po overeni `fastboot flash boot`.
          - Vzdy si zalohuj stock `boot.img`.
          - Autor ani siritel neruci za ziadne skody. Flashujes na vlastne riziko.
          EOF
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Spacewar KSU+SUSFS (netestovany build #${{ github.run_number }})" \
            --prerelease \
            --notes-file notes.md \
            Spacewar-KSU-SUSFS.zip
          if [ -f new-boot.img ]; then
            gh release upload "$TAG" new-boot.img --repo "$GITHUB_REPOSITORY"
          fi
